<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>색칠 그림</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 시작 화면: 그림 고르기 -->
<section id="picker"></section>

<!-- 색칠 화면 -->
<section id="stage" hidden>
  <canvas id="paint"></canvas>

  <!-- 멘토 전용: 2초 길게 눌러야 작동 -->
  <button id="btnRestart" class="mentor" type="button" aria-label="처음부터 다시">
    <svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/></svg>
    <svg class="icon" viewBox="0 0 48 48"><path d="M36 24a12 12 0 1 1-4-9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M37 6v10H27" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btnHome" class="mentor" type="button" aria-label="시작 화면으로">
    <svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/></svg>
    <svg class="icon" viewBox="0 0 48 48"><rect x="11" y="11" width="11" height="11" rx="3" fill="currentColor"/><rect x="26" y="11" width="11" height="11" rx="3" fill="currentColor"/><rect x="11" y="26" width="11" height="11" rx="3" fill="currentColor"/><rect x="26" y="26" width="11" height="11" rx="3" fill="currentColor"/></svg>
  </button>

  <!-- 완성 후 2~3초 뒤에 나타나는 버튼 (아이콘만) -->
  <button id="btnDone" type="button" aria-label="그림 고르기" hidden>
    <svg viewBox="0 0 48 48"><rect x="9" y="9" width="13" height="13" rx="3.5" fill="currentColor"/><rect x="26" y="9" width="13" height="13" rx="3.5" fill="currentColor"/><rect x="9" y="26" width="13" height="13" rx="3.5" fill="currentColor"/><rect x="26" y="26" width="13" height="13" rx="3.5" fill="currentColor"/></svg>
  </button>
</section>

<!-- 멘토 전용(시작 화면): 2초 길게 누르면 그림 관리 화면이 열림 -->
<button id="btnMentor" class="mentor" type="button" aria-label="그림 관리 (멘토용)">
  <svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/></svg>
  <svg class="icon" viewBox="0 0 48 48"><path d="M24 10v28M10 24h28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
</button>

<!-- 멘토 전용: 그림 추가/삭제 -->
<section id="panel" hidden>
  <div class="box">
    <h1>그림 관리 (멘토용)</h1>
    <p class="hint">패드의 사진이나 그림 파일을 골라 추가할 수 있습니다. 추가한 그림은 이 패드에만 저장됩니다.</p>
    <div class="row">
      <button id="btnAdd" type="button" class="big">＋ 그림 추가</button>
      <button id="btnClose" type="button" class="big plain">닫기</button>
    </div>
    <p id="panelStatus" class="status"></p>
    <div id="panelList"></div>
  </div>
  <input id="fileInput" type="file" accept="image/*" multiple hidden>
</section>

<script src="app.js"></script>
</body>
</html>
